<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CartoGo Manila - Car Rental AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0c;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #chat-container {
      width: 440px;
      height: 720px;
      background: #0f0f12;
      border: 1px solid #22222a;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    /* Header */
    #chat-header {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #141418;
      border-bottom: 1px solid #22222a;
      flex-shrink: 0;
    }

    .bot-info h1 {
      font-size: 16px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.2px;
    }

    .bot-info .status {
      font-size: 11px;
      color: #818cf8;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }

    #clear-btn {
      margin-left: auto;
      background: #1e1e24;
      border: 1px solid #33333f;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    #clear-btn:hover {
      border-color: #2e2d2b;
      color: #f8fafc;
    }

    /* Quick actions */
    #quick-actions {
      padding: 12px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid #1e1e24;
      background: #0f0f12;
      flex-shrink: 0;
    }

    #quick-actions::-webkit-scrollbar {
      display: none;
    }

    .quick-btn {
      background: #18181c;
      border: 1px solid #2a2a35;
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .quick-btn:hover {
      border-color: #2e2c29;
      color: #24231f;
      background: #22222a;
    }

    /* Messages */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    #chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    #chat-messages::-webkit-scrollbar-thumb {
      background: #2a2a35;
      border-radius: 4px;
    }

    .message {
      display: flex;
      gap: 10px;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #18181c;
      border: 1px solid #2a2a35;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .message.bot .msg-avatar {
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      border: none;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      max-width: 82%;
    }

    .message.user .msg-content {
      align-items: flex-end;
    }

    .msg-bubble {
      padding: 12px 15px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.bot .msg-bubble {
      background: #16161a;
      border: 1px solid #262630;
      border-bottom-left-radius: 4px;
      color: #e2e8f0;
    }

    .message.user .msg-bubble {
      background: #2e2e2d;
      color: #ffffff;
      border-bottom-right-radius: 4px;
      font-weight: 500;
    }

    .msg-bubble strong {
      font-weight: 600;
      color: #f5f5f3ec;
    }

    .message.user .msg-bubble strong {
      color: #ffffff;
    }

    .msg-time {
      font-size: 10px;
      color: #e6e6e6;
      margin-top: 4px;
      padding: 0 2px;
    }

    /* Typing */
    .typing-indicator {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .typing-dots {
      background: #16161a;
      border: 1px solid #262630;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: #eab308;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.3;
      }

      40% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    /* Input */
    #chat-input-area {
      padding: 14px 16px;
      border-top: 1px solid #1e1e24;
      background: #141418;
      flex-shrink: 0;
    }

    #input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #0f0f12;
      border: 1px solid #2a2a35;
      border-radius: 12px;
      padding: 4px 4px 4px 14px;
      transition: border-color 0.2s;
    }

    #input-wrapper:focus-within {
      border-color: #44423c;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #d9d9d9;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      padding: 8px 0;
    }

    #user-input::placeholder {
      color: #64748b;
    }

    #send-btn {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.2s;
    }

    #send-btn:hover {
      opacity: 0.9;
    }

    #send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    #send-btn svg {
      width: 16px;
      height: 16px;
      fill: #000;
    }

    .chat-footer {
      text-align: center;
      font-size: 10px;
      color: #ffffff;
      padding: 8px 16px 12px;
      background: #141418;
      flex-shrink: 0;
    }
  </style>
</head>

<body>

  <div id="chat-container">
    <div id="chat-header">
      <div class="bot-avatar"></div>
      <div class="bot-info">
        <h1>CartoGo Manila</h1>
        <div class="status">
          <div class="status-dot"></div>
          Online
        </div>
      </div>
      <button id="clear-btn">Clear</button>
    </div>

    <div id="quick-actions">
      <button class="quick-btn" data-msg="What are your rental rates and available cars?"> Fleet & Rates</button>
      <button class="quick-btn" data-msg="What are the requirements for self drive?"> Requirements</button>
      <button class="quick-btn" data-msg="How can I book a car rental?"> How to Book</button>
      <button class="quick-btn" data-msg="Contact details and pick up location"> Contact Us</button>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-input-area">
      <div id="input-wrapper">
        <input type="text" id="user-input" placeholder="Ask about car rentals in Manila..." autocomplete="off"
          maxlength="500" />
        <button id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </div>
    <div class="chat-footer">CartoGo Manila · Premium Car Rental Services</div>
  </div>

  <script>
    const API_URL = '/api/chat.php';
    const sessionId = 'cartogo_' + Math.random().toString(36).slice(2, 11);
    const messages = document.getElementById('chat-messages');
    const input = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function formatTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatText(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function appendMessage(text, role) {
      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;

      const av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = role === 'bot' ? '' : '👤';

      const content = document.createElement('div');
      content.className = 'msg-content';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = formatText(text);

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = formatTime();

      content.appendChild(bubble);
      content.appendChild(time);
      wrapper.appendChild(av);
      wrapper.appendChild(content);
      messages.appendChild(wrapper);
      scrollToBottom();
    }

    function showTyping() {
      const wrapper = document.createElement('div');
      wrapper.className = 'typing-indicator';
      wrapper.id = 'typing';
      const av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = '🚗';
      const dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';
      wrapper.appendChild(av);
      wrapper.appendChild(dots);
      messages.appendChild(wrapper);
      scrollToBottom();
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function sendMessage(text) {
      text = text.trim();
      if (!text) return;

      input.value = '';
      sendBtn.disabled = true;
      appendMessage(text, 'user');
      showTyping();

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        const data = await res.json();
        hideTyping();
        if (data.success) {
          appendMessage(data.data.response, 'bot');
        } else {
          appendMessage('Error: ' + (data.error || 'Unknown error'), 'bot');
        }
      } catch (err) {
        hideTyping();
        appendMessage('Could not reach server. Make sure PHP server is running:\nphp -S localhost:8001 router.php', 'bot');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', () => sendMessage(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); }
    });
    document.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
    });
    document.getElementById('clear-btn').addEventListener('click', () => {
      messages.innerHTML = '';
      greet();
    });

    function greet() {
      setTimeout(() => {
        appendMessage("Mabuhay! Welcome to **CartoGo Manila** Car Rental Services! \n\nI can help you with:\n• **Car Rates & Fleet** (Sedan, SUV, Van)\n• **Self-Drive Services**\n• **Airport Transfers (NAIA)**\n• **Booking Requirements & Payment**\n\nHow can I assist your journey today?", 'bot');
      }, 300);
    }

    greet();
  </script>
</body>

</html>
