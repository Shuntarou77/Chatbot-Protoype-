<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniVanguardChatBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #chat-container {
      width: 420px;
      height: 700px;
      background: #000;
      border: 1px solid #222;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    #chat-header {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .bot-info h1 {
      font-size: 15px;
      font-weight: 600;
    }

    .bot-info .status {
      font-size: 11px;
      color: #25920d;
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
    }

    #clear-btn {
      margin-left: auto;
      background: none;
      border: 1px solid #333;
      color: #555;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }

    #clear-btn:hover {
      border-color: #555;
      color: #aaa;
    }

    /* Quick actions */
    #quick-actions {
      padding: 10px 16px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }

    .quick-btn {
      background: #111;
      border: 1px solid #333;
      color: #888;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      white-space: nowrap;
    }

    .quick-btn:hover {
      border-color: #555;
      color: #ccc;
    }

    /* Messages */
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    #chat-messages::-webkit-scrollbar {
      width: 3px;
    }

    #chat-messages::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 3px;
    }

    .message {
      display: flex;
      gap: 8px;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #111;
      border: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      max-width: 78%;
    }

    .message.user .msg-content {
      align-items: flex-end;
    }

    .msg-bubble {
      padding: 10px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .message.bot .msg-bubble {
      background: #111;
      border: 1px solid #2a2a2a;
      border-bottom-left-radius: 4px;
    }

    .message.user .msg-bubble {
      background: #1a1a1a;
      border: 1px solid #333;
      border-bottom-right-radius: 4px;
    }

    .msg-bubble strong {
      font-weight: 600;
      color: #fff;
    }

    .msg-time {
      font-size: 10px;
      color: #e0dddd;
      margin-top: 4px;
      padding: 0 2px;
    }

    /* Typing */
    .typing-indicator {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .typing-dots {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      padding: 12px 14px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: #444;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      40% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* Input */
    #chat-input-area {
      padding: 12px 16px;
      border-top: 1px solid #222;
      flex-shrink: 0;
    }

    #input-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #111;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 4px 4px 4px 14px;
    }

    #input-wrapper:focus-within {
      border-color: #555;
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e6edf3;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      padding: 7px 0;
    }

    #user-input::placeholder {
      color: #444;
    }

    #send-btn {
      width: 34px;
      height: 34px;
      background: #222;
      border: 1px solid #444;
      border-radius: 7px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #send-btn:hover {
      background: #2a2a2a;
      border-color: #666;
    }

    #send-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    #send-btn svg {
      width: 15px;
      height: 15px;
      fill: #aaa;
    }

    .chat-footer {
      text-align: center;
      font-size: 10px;
      color: #c7c5c5;
      padding: 6px 16px 10px;
      flex-shrink: 0;
    }
  </style>
</head>

<body>

  <div id="chat-container">
    <div id="chat-header">
      <div class="bot-avatar"></div>
      <div class="bot-info">
        <h1>UniVanguardChatBot</h1>
        <div class="status">
          <div class="status-dot"></div>
          Online
        </div>
      </div>
      <button id="clear-btn">Clear</button>
    </div>
    <!-- Pwede lagyan ng logos ang left side ng mga actions -->
    <div id="quick-actions">
      <button class="quick-btn" data-msg="Get a quote"> Quote</button>
      <button class="quick-btn" data-msg="File a claim"> Claim</button>
      <button class="quick-btn" data-msg="Check my policy"> Policy</button>
      <button class="quick-btn" data-msg="payment options">Payments</button>
      <button class="quick-btn" data-msg="contact agent">Contact</button>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-input-area">
      <div id="input-wrapper">
        <input type="text" id="user-input" placeholder="Ask me about insurance..." autocomplete="off" maxlength="500" />
        <button id="send-btn" title="Send">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
    </div>
    <div class="chat-footer">UniVanguard ChatBot Responses may not reflect actual policy terms</div>
  </div>

  <script>
    const API_URL = '/api/chat.php';
    const sessionId = 'sess_' + Math.random().toString(36).slice(2, 11);
    const messages = document.getElementById('chat-messages');
    const input = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function formatTime() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function formatText(text) {
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    function appendMessage(text, role) {
      const wrapper = document.createElement('div');
      wrapper.className = `message ${role}`;

      const av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = role === 'bot' ? '' : '👤'; //Logo ng avatar sa chat

      const content = document.createElement('div');
      content.className = 'msg-content';

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.innerHTML = formatText(text);

      const time = document.createElement('div');
      time.className = 'msg-time';
      time.textContent = formatTime();

      content.appendChild(bubble);
      content.appendChild(time);
      wrapper.appendChild(av);
      wrapper.appendChild(content);
      messages.appendChild(wrapper);
      scrollToBottom();
    }

    function showTyping() {
      const wrapper = document.createElement('div');
      wrapper.className = 'typing-indicator';
      wrapper.id = 'typing';
      const av = document.createElement('div');
      av.className = 'msg-avatar';
      av.textContent = '';
      const dots = document.createElement('div');
      dots.className = 'typing-dots';
      dots.innerHTML = '<span></span><span></span><span></span>';
      wrapper.appendChild(av);
      wrapper.appendChild(dots);
      messages.appendChild(wrapper);
      scrollToBottom();
    }

    function hideTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    async function sendMessage(text) {
      text = text.trim();
      if (!text) return;

      input.value = '';
      sendBtn.disabled = true;
      appendMessage(text, 'user');
      showTyping();

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });
        const data = await res.json();
        hideTyping();
        if (data.success) {
          appendMessage(data.data.response, 'bot');
        } else {
          appendMessage('Error: ' + (data.error || 'Unknown error'), 'bot');
        }
      } catch (err) {
        hideTyping();
        appendMessage('Could not reach the server. Make sure PHP is running:\nphp -S localhost:8000 -t public', 'bot');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', () => sendMessage(input.value));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(input.value); }
    });
    document.querySelectorAll('.quick-btn').forEach(btn => {
      btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
    });
    document.getElementById('clear-btn').addEventListener('click', () => {
      messages.innerHTML = '';
      greet();
    });

    function greet() {
      setTimeout(() => {
        appendMessage("Hello! I'm **UniVanguardChatBot**, your virtual insurance assistant.\n\nHow can I help you today?\n\n• Get a quote\n• Check your policy\n• File a claim\n• Billing & payments\n• Talk to an agent", 'bot');
      }, 300);
    }

    greet();
  </script>
</body>

</html>
